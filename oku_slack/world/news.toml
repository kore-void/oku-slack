# Persona -> real person. Terms are whole words, case-sensitive when capitalised (lower-case terms match any case); `*` = any Czech ending (0-6 letters), a space = any
# whitespace. `weak_terms` count only when one of `context` also appears in the headline + lede (common surnames).
# `exclude`: an article matching one of these is ignored for this person (e.g. Babiš's wife -> family topic).
[news.people.babis]
person = "Andrej Babiš"
enabled = true                 # persona/babis/COSPLAY: "You ARE Andrej Babiš"
terms = ["Babiš*", "Babis"]
exclude = ["Babišová", "Babišové", "Monik* Babiš*"]
pplx_query = "Andrej Babiš"
[news.people.bourak]
person = "Filip Turek"
enabled = true                 # persona/bourak: "Filip „Bourák“ Turek"
terms = ["Filip* Turek", "Filip* Turk*"]
weak_terms = ["Turek", "Turka", "Turkovi", "Turkem", "Turkův", "Turkova", "Turkovo", "Turkovy", "Turkových", "Turkovým"]
context = ["Motorist*", "ministr*", "ministerst*", "poslan*", "europoslan*", "vlád*", "Babiš*", "Macink*", "Filip*"]
pplx_query = "Filip Turek (Motoristé)"
[news.people.peta]
person = "Petr Macinka"
enabled = true                 # persona/peta: "Peťa Maci (stage twin also called Macinka in lore)"
terms = ["Macink*"]
pplx_query = "Petr Macinka"
[news.people.kalousek]
person = "Miroslav Kalousek"
enabled = true                 # persona/kalousek: "Kalousek" (Babiš's eternal culprit)
terms = ["Kalousek", "Kalousk*"]
pplx_query = "Miroslav Kalousek"
[news.people.marty]
person = "Marek Prchal"
enabled = true                 # persona/marty: "Marty Prchal", social-media war-room producer (Babiš's PR man)
terms = ["Marek Prchal", "Mark* Prchal*"]
weak_terms = ["Prchal*"]
context = ["Babiš*", "ANO", "hnutí", "mluvčí*", "poradce", "poradc*", "PR", "kampaň*", "marketing*", "sociální* sít*", "premiér*", "Úřad* vlády"]
pplx_query = "Marek Prchal (poradce Andreje Babiše)"
[news.people.alenka]
person = "Alena Schillerová"
enabled = true                 # persona/alenka: "Classic template = Schillerová-style fry-box energy"
terms = ["Schillerov*"]
pplx_query = "Alena Schillerová"
