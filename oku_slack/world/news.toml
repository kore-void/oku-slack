# OKÚ zpravodajství (docs/WORLD.md "News"): real current Czech news ABOUT the real people behind the OKÚ personas.
# Read by oku_world (oku_slack/world/news.py), re-read on change (no restart). Env OKU_NEWS_CONFIG overrides the path.
# The fetchers only append podnety (kind = "news") to <diary logs>/inbox/podnety.jsonl; the news director lets the
# matching persona share headline + link + a 1-2 sentence in-character reaction (generated by the bridge, which only
# sees the headline and lede), inside the world budget ([world] in config.toml) plus the news budget below.

[news]
enabled = true                 # RSS + pplx fetchers
react = true                   # news director (the world's [world] dry_run still applies: dry run -> news.dry_run rows only)
hours = ["07:00", "22:00"]     # fetch window, Europe/Prague
rss_interval_min = 30
max_age_h = 24                 # only articles published within this (by pubDate / article:published_time)
react_max_age_h = 6            # the persona only reacts to articles published within this
react_requires_headline = true # the person must be named in the headline itself (lede-only matches go to the digest only)
reactions_per_day = 10         # news reactions per day (separate from podnet_reactions_per_day; posts_per_day still applies)
per_person_per_day = 2
reply_rate = 0.5               # chance that a second persona replies once in the thread
channel = "socky"              # default channel key of [world.chatter_channels] (#oku-socky); per-person `channel` overrides
channel_gap_h = 1              # per-channel gap for news posts only (chatter keeps [world] per_channel_gap_h = 3)
fetch_timeout_s = 15
max_new_per_cycle = 60

[news.pplx]
enabled = true
times = ["09:15", "17:45"]     # Europe/Prague; one void-pplx-ask call per enabled person, one after another (never concurrent)
mode = "fast"
timeout_s = 150
command = "void-pplx-ask"
max_per_person = 3
verify = true                  # fetch each article: allowed news host, real page, headline names the person, fresh

