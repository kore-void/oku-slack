# Wheel of fortune: players + events. No secrets here.
# room_key: per-player key used by the web room (?p=<id>&k=<room_key>). Change before exposing the room beyond localhost.

[settings]
cooldown_s = 1800        # charged command: once per 30 min per player
sequence_s = 120         # charged command sequence length
alarm_before_s = 300     # alarm 5 min before event start
lead_s = 600             # spin -> event start (default 10 min)
confirm_wait_s = 1800    # event expires if not all players confirmed within this after its start time
hold_min_s = 2.0         # press-and-hold confirmation threshold
spin_ms = 6000           # wheel spin animation length in the room
slack_channel = "C0C6W8E6NP9"  # oku-porada: alarms/results
allow_force = true      # testing: allow forced spins (set false in production)
nag_before_s = 120      # host nags missing players this long before start

[players.kore]
name = "Kore"
slack_id = "U0C6XAN3EG3"
room_key = "kore-local"
command = "Sorry jako"        # Kore's charged command label

[players.icik]
name = "ICIK"
slack_id = "UICIK_PLACEHOLDER"   # [ASSUMPTION] real Slack id unknown; fill in
room_key = "icik-local"
command = "Kalousek za to může"

