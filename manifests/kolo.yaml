# Dedicated "Kolo" app for the wheel (separate from persona apps so Socket Mode events are not split).
display_information:
  name: "OKÚ Kolo"
  background_color: "#1d4f91"
features:
  bot_user:
    display_name: "OKÚ Kolo"
    always_online: true
  slash_commands:
    - command: /kolo
      description: "Kolo štěstí OKÚ: točit / potvrdit / prikaz / stav"
      usage_hint: "[potvrdit|prikaz|stav]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - files:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
