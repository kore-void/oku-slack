# OKÚ Slack satire team. Secrets are NEVER here: SLACK_OKU_<KEY>_BOT_TOKEN / _APP_TOKEN per persona (babis falls back to SLACK_OKU_BOT_TOKEN / SLACK_OKU_APP_TOKEN), LLM_API_KEY come from env.
default_persona = "babis"
history_limit = 20
# icon_url must be a public https URL; empty = Slack app's default icon.
icon_base_url = "https://raw.githubusercontent.com/kore-void/oku-slack/main/assets/avatars/"

# channel_defaults: documentation only since solo bots (each app answers as itself).
[channel_defaults]
"C0C6W8E6NP9" = "babis"    # oku-porada
"C0C75CZ2UCT" = "babis"    # oku-dotace-desk
"C0C7BF296P4" = "alenka"   # oku-kantyna
"C0C76ATANTX" = "marty"    # oku-socky
"C0C75CZPRUK" = "peta"     # oku-disko
"C0C76ATGLAH" = "kalousek" # oku-vina

[personas.babis]
name = "Andrej Babiš"
dir = "babis"
files = ["COSPLAY-v3.1.md", "hlasky-canon.md"]
aliases = ["babiš", "babis", "andrej", "andrej babiš", "agrofert"]
