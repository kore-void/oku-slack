# OKÚ Slack satire team: solo bots, one Slack app per persona (see CLAUDE-SOLO-BOTS.md).
# Secrets are NEVER here. Per persona [personas.<key>] the service reads SLACK_OKU_<KEY>_BOT_TOKEN / SLACK_OKU_<KEY>_APP_TOKEN
# from env (Babiš falls back to SLACK_OKU_BOT_TOKEN / SLACK_OKU_APP_TOKEN); a persona without tokens is skipped.
# Each app answers only its own @mentions/DMs as its own persona. Name/icon come from the Slack app (upload assets/avatars/<avatar>).
# name = how the other personas see this one in thread history.
history_limit = 20

