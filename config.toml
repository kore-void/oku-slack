[personas.kalousek]
name = "Kalousek"
dir = "kalousek"
aliases = ["kalousek", "kalousku", "kalouska", "kalouskovi"]
avatar = "kalousek.png"
# Solo bots: Kalousek's own app answers direct mentions/DMs; blame_only/blame_patterns only matter for the
# optional legacy blame follow-up (top-level blame_followup = true, off by default).
blame_only = true
blame_patterns = ["za to může", "může za to", "může za", "kvůli kalousk", "vina kalousk", "kalousek za", "zavinil", "kalousek to"]

# LLM cost ESTIMATES (configurable): USD per 1M tokens. Output price also applies to thinking tokens.
# NOTE: keys on the Gemini free tier actually cost $0; these numbers show what paid tier would cost.
[pricing]
"gemini-2.5-flash" = { input = 0.30, output = 2.50 }
"gemini-2.5-flash-lite" = { input = 0.10, output = 0.40 }

# Usage reports DMed (via the Babiš app's bot client) to dm_user. Failures never affect replies.
[reporting]
per_call = true         # one line after each solo bot reply
meeting_summary = true  # summary after each meeting ends
dm_user = "U0C6XAN3EG3"

# One-off "awaiting reply" for Babiš's #čapák post to ICIK (state in logs/capak_followup.json; never resends).
[capak_followup]
enabled = false         # D12: finished (logs/capak_followup.json "done": "timeout"); kept for reference only
channel = "C0C76PTMJ9Z"
user = "U0C75FSEK2M"
anchor_ts = "1791365300.705149"
interval_s = 120
hard_stop_min = 45

# Babiš invites/kicks members of allowed private channels on command from owner only
# ("@Andrej_Bures vyhoď @X", "Andreji, pozvi X"). Needs bot scope groups:write (manifests/babis.yaml).
# Never kicks owner or the bot itself; other users' commands are refused (mention) or ignored (no mention).
[moderation]
enabled = true
allowed_channels = ["C0C76PTMJ9Z"]  # čapák
owner_user_id = "U0C6XAN3EG3"       # Kore

# OKÚ world core (service oku_world, python -m oku_slack.world.service, loopback 127.0.0.1:8798; docs/WORLD.md).
# Re-read on change (no restart). dry_run = true: the world only writes diary rows about what it WOULD do; nothing is
# handed to the bridge and nothing is posted. Env OKU_WORLD_DRY_RUN=0/1 overrides. Kill switch: kill_switch = true,
# or create logs/world.kill (diary logs dir), or env OKU_WORLD_KILL=1.
[world]
dry_run = true
kill_switch = false
regime = "A_scarce"
timezone = "Europe/Prague"
quiet_hours = ["22:00", "08:00"]
# Standalone scheduled porada (independent of the wheel): a REAL bot porada (meeting.py) via the bridge file hand-off.
porada_enabled = true
porada_schedule = "mon-fri 10:00"
porada_channel = "C0C6W8E6NP9"   # #oku-porada
porada_grace_min = 30            # a slot later than this (service was down) is skipped, never caught up
porada_llm_estimate = 12         # LLM calls charged to the world budget per porada (meeting = 8-12 turns)
porada_ack_timeout_s = 120
# Budget (decision D2): autonomous actions only; human-triggered replies/poradas never count.
posts_per_day = 6                # top-level posts per day, all world sources together
per_channel_gap_h = 3            # at most 1 top-level post per channel per 3 h
chatter_threads_per_day = 2      # autonomous persona-to-persona threads (P-005)
chatter_max_turns = 4            # opener + replies in one thread; the bridge also hard-caps at 4
llm_calls_per_day = 40
no_posts_while_wheel_live = true
tick_s = 15
# Autonomous persona chatter (P-005, docs/WORLD.md): the director picks a storylet, 2-3 personas and a persona channel
# per slot; dry_run writes chatter.dry_run only; live hands a kind=chatter line to the bridge, which runs <= 4 turns.
chatter_enabled = true
chatter_schedule = "mon-fri 11:30,16:30"
chatter_grace_min = 30
chatter_ack_timeout_s = 120      # no 'started' ack by then -> chatter.failed no_ack
chatter_done_timeout_s = 900     # started but no 'done' ack by then -> chatter.ended timeout
legacy_wheel_tail = true         # also read the old in-wheel diary (wheel.sqlite3:world_events, read-only) until the outbox wheel is deployed

# Persona channels the chatter may use (world picks; the bridge only accepts these when the table is present).
[world.chatter_channels]
kantyna = "C0C7BF296P4"   # #oku-kantyna
dotace = "C0C75CZ2UCT"    # #oku-dotace-desk
socky = "C0C76ATANTX"     # #oku-socky
disko = "C0C75CZPRUK"     # #oku-disko
vina = "C0C76ATGLAH"      # #oku-vina
