# OKÚ Slack satire team. Secrets are NEVER here: SLACK_OKU_<KEY>_BOT_TOKEN / _APP_TOKEN per persona (babis falls back to SLACK_OKU_BOT_TOKEN / SLACK_OKU_APP_TOKEN), LLM_API_KEY come from env.
default_persona = "babis"
history_limit = 20
# icon_url must be a public https URL; empty = Slack app's default icon.
icon_base_url = "https://raw.githubusercontent.com/kore-void/oku-slack/main/assets/avatars/"

# channel_defaults: documentation only since solo bots (each app answers as itself).
[channel_defaults]
"C0C6W8E6NP9" = "babis"    # oku-porada
"C0C75CZ2UCT" = "babis"    # oku-dotace-desk
"C0C7BF296P4" = "alenka"   # oku-kantyna
"C0C76ATANTX" = "marty"    # oku-socky
"C0C75CZPRUK" = "peta"     # oku-disko
"C0C76ATGLAH" = "kalousek" # oku-vina

[personas.babis]
name = "Andrej Babiš"
dir = "babis"
files = ["COSPLAY-v3.1.md", "hlasky-canon.md"]
aliases = ["babiš", "babis", "andrej", "andrej babiš", "agrofert"]
avatar = "babis.png"

[personas.alenka]
name = "Alenka Hranolka"
dir = "alenka"
aliases = ["alenka", "hranolka", "alenko"]
avatar = "alenka.png"

[personas.bourak]
name = "Filip Bourák Turek"
dir = "bourak"
aliases = ["bourák", "bourak", "turek", "filip", "filipe"]
avatar = "bourak.png"

[personas.marty]
name = "Marty Prchal"
dir = "marty"
aliases = ["marty", "prchal", "marty prchal"]
avatar = "marty.png"

[personas.peta]
name = "Peťa Maci"
dir = "peta"
aliases = ["peťa", "peta", "maci", "macinka", "peťo"]
avatar = "peta.png"

[personas.kalousek]
name = "Kalousek"
dir = "kalousek"
aliases = ["kalousek", "kalousku", "kalouska", "kalouskovi"]
avatar = "kalousek.png"
# Solo bots: Kalousek's own app answers direct mentions/DMs; blame_only/blame_patterns only matter for the
# optional legacy blame follow-up (top-level blame_followup = true, off by default).
blame_only = true
blame_patterns = ["za to může", "může za to", "může za", "kvůli kalousk", "vina kalousk", "kalousek za", "zavinil", "kalousek to"]

# LLM cost ESTIMATES (configurable): USD per 1M tokens. Output price also applies to thinking tokens.
# NOTE: keys on the Gemini free tier actually cost $0; these numbers show what paid tier would cost.
[pricing]
"gemini-2.5-flash" = { input = 0.30, output = 2.50 }
"gemini-2.5-flash-lite" = { input = 0.10, output = 0.40 }

# Usage reports DMed (via the Babiš app's bot client) to dm_user. Failures never affect replies.
[reporting]
per_call = true         # one line after each solo bot reply
meeting_summary = true  # summary after each meeting ends
dm_user = "U0C6XAN3EG3"

# One-off "awaiting reply" for Babiš's #čapák post to ICIK (state in logs/capak_followup.json; never resends).
[capak_followup]
enabled = false         # D12: finished (logs/capak_followup.json "done": "timeout"); kept for reference only
channel = "C0C76PTMJ9Z"
user = "U0C75FSEK2M"
anchor_ts = "1791365300.705149"
interval_s = 120
hard_stop_min = 45

# Babiš invites/kicks members of allowed private channels on command from owner only
# ("@Andrej_Bures vyhoď @X", "Andreji, pozvi X"). Needs bot scope groups:write (manifests/babis.yaml).
# Never kicks owner or the bot itself; other users' commands are refused (mention) or ignored (no mention).
[moderation]
enabled = true
allowed_channels = ["C0C76PTMJ9Z"]  # čapák
owner_user_id = "U0C6XAN3EG3"       # Kore
